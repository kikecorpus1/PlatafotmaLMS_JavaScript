<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academia SWBAR400 — Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
        crossorigin="anonymous">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="contenedorLogin">

    <img src="./recursos/img/img/diminutivo1.png" alt="Logo" class="diminutivo-login">

    <div>
      <h2>Academia SWBAR400</h2>
      <p style="text-align:center; color:var(--color-texto-muted); font-size:0.85rem; margin-top:4px;">
        Plataforma de aprendizaje
      </p>
    </div>

    <div>
      <label for="floatingSelect" style="font-size:0.82rem; font-family:var(--fuente-titulo); color:var(--color-texto2); display:block; margin-bottom:6px;">
        Tipo de Usuario
      </label>
      <select class="form-control" id="floatingSelect" style="appearance:auto; cursor:pointer;">
        <option value="Selecciona Tipo de Usuario">Selecciona tu rol...</option>
        <option value="1">Administrador</option>
        <option value="2">Docente</option>
        <option value="3">Estudiante</option>
      </select>
    </div>

    <div>
      <label for="floatingInput" style="font-size:0.82rem; font-family:var(--fuente-titulo); color:var(--color-texto2); display:block; margin-bottom:6px;">
        Correo / Usuario
      </label>
      <input type="email" class="form-control" id="floatingInput" placeholder="correo@ejemplo.com">
    </div>

    <div>
      <label for="floatingPassword" style="font-size:0.82rem; font-family:var(--fuente-titulo); color:var(--color-texto2); display:block; margin-bottom:6px;">
        Contraseña
      </label>
      <input type="password" class="form-control" id="floatingPassword" placeholder="••••••••">
    </div>

    <button type="button" class="botones" id="ingresar">Ingresar →</button>

    <p class="login-footer">Academia SWBAR400 · Campuslands · 2025-2026</p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>
  <script src="./script/script.js"></script>
</body>
</html>
