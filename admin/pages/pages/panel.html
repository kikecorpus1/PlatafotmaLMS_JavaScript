<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .curso-card {
      background-color: var(--color-tarjeta);
      border-radius: 1rem;
      padding: 1rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    .curso-card img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 0.5rem;
    }
    .curso-info h5 { margin: 0 0 4px; }
    .curso-info p  { margin: 0; font-size: 0.85rem; color: var(--color-componentes2); }
    .bienvenida {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 1.5rem;
      background-color: var(--color-tarjeta);
      border-radius: 1rem;
      margin-bottom: 2rem;
    }
    .bienvenida img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="contenedorDePagina">

    <!-- Sidebar -->
    <div class="sidebar">
      <img src="../recursos/img/img/diminutivo1.png" class="diminutivo">
      <nav class="nav flex-column">
        <div class="contenedorRecientes">
          <div class="nav-link active">
            <a href="./panel.html"><p>Panel</p></a>
          </div>
          <div class="nav-link">
            <a href="#cursos"><p>Mis Cursos</p></a>
          </div>
          <div class="nav-link">
            <a href="#" id="btnCerrarSesion"><p>Cerrar Sesión</p></a>
          </div>
        </div>
      </nav>
    </div>

    <!-- Principal -->
    <div class="principal">

      <!-- Encabezado -->
      <div class="encabezado">
        <nav class="navbar navbar-expand-lg">
          <div class="container-fluid">
            <div class="navegadores">
              <div class="pages">
                <a class="nav-link active" href="./panel.html">Panel</a>
              </div>
              <div class="botonesH">
                <a href="#" id="cerrarSesionNav">
                  <img src="../recursos/img/componentes/person-circle.svg" alt="">
                </a>
                <p id="nombreUsuarioNav">Usuario</p>
              </div>
            </div>
          </div>
        </nav>
      </div>

      <!-- Cuerpo -->
      <div class="cuerpo">
        <div class="dashboard">

          <!-- Bienvenida -->
          <div class="bienvenida" id="bienvenida">
            <img id="fotoBienvenida" src="" alt="foto">
            <div>
              <h2 id="saludo">Bienvenido</h2>
              <p id="rolUsuario"></p>
              <p id="usuarioInfo"></p>
            </div>
          </div>

          <!-- Cursos -->
          <h2 id="cursos">Mis Cursos</h2>
          <div id="contenedorCursos">
            <p class="text-muted">Cargando cursos...</p>
          </div>

        </div>

        <!-- Sidebar 2 -->
        <div class="sidebarCuerpo">
          <h2>Mi Información</h2>
          <div class="estadisticas">
            <div class="cuadroEstadistica">
              <p class="titulito">Nombre</p>
              <p class="infoEstadistica" id="statNombre" style="font-size:1vw">—</p>
            </div>
            <div class="cuadroEstadistica">
              <p class="titulito">Rol</p>
              <p class="infoEstadistica" id="statRol">—</p>
            </div>
            <div class="cuadroEstadistica">
              <p class="titulito">Cursos</p>
              <p class="infoEstadistica" id="statCursos">—</p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous">
  </script>
  <script src="./script/panelUsuario.js"></script>
</body>
</html>
